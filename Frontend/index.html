<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediChat AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">
                <i class="fa-solid fa-stethoscope"></i>
            </div>
            <h1>MediChat</h1>
        </div>
        
        <div class="sidebar-info">
            <p class="info-title">Architecture</p>
            <p class="info-desc">RAG + Llama 3.1 8B</p>
            <p class="info-desc">Local FAISS Database</p>
        </div>

        <button class="clear-btn" onclick="clearTerminal()">
            <i class="fa-regular fa-trash-can"></i>
            <span>Clear Session</span>
        </button>
    </div>

    <div class="main-content">
        
        <div class="chat-box" id="chat-box">
            <div class="message ai-message">
                <div class="avatar ai-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="message-text ai-text">
                    Hello. I am the MediChat AI assistant, powered by the NIH MedQuAD database. How can I assist you with your medical query today?
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Type your symptom or query..." onkeypress="handleKeyPress(event)">
                <button id="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
            <p class="disclaimer">MediChat is an academic prototype. Verify important medical information.</p>
        </div>

    </div>

    <script>
    let chatHistory = [];

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function addMessageToUI(role, text) {
        const chatBox = document.getElementById('chat-box');
        const messageDiv = document.createElement('div');
        messageDiv.className = role === 'user' ? "message user-message" : "message ai-message";
        
        const iconHTML = role === 'user' 
            ? `<div class="avatar user-avatar"><i class="fa-solid fa-user"></i></div>`
            : `<div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>`;
        
        const textClass = role === 'user' ? "message-text user-text" : "message-text ai-text";
        const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

        messageDiv.innerHTML = `${iconHTML}<div class="${textClass}">${formattedText}</div>`;
        chatBox.appendChild(messageDiv);
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const text = inputField.value.trim();
        
        if (!text) return;

        addMessageToUI('user', text);
        inputField.value = '';
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

        try {
            const response = await fetch('https://medichat-backend-9pn4.onrender.com/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history: chatHistory })
            });
            
            // FIX 3: Catch backend server errors explicitly
            if (!response.ok) {
                const errData = await response.json();
                addMessageToUI('assistant', "⚠️ Server Error: " + (errData.detail || response.statusText));
                return;
            }
            
            const data = await response.json();
            
            // FIX 4: Ensure the UI updates even if the JSON is malformed
            if(data && data.reply) {
                addMessageToUI('assistant', data.reply);
                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: data.reply });
            } else {
                addMessageToUI('assistant', "⚠️ Received an empty response from the AI.");
            }
        } catch (error) {
            // FIX 5: Catch complete network failures (Server offline)
            addMessageToUI('assistant', "⚠️ Connection failed. Please check if your FastAPI server is running.");
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
        }
    }

    function clearTerminal() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = chatBox.firstElementChild.outerHTML; 
        chatHistory = [];
    }
    </script>
</body>
</html>
